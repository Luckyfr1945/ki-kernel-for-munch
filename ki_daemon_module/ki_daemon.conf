# ==============================================================================
#  Ki-Daemon (Auto Game Turbo) Configuration
#  Location: /sdcard/ki_daemon.conf
#  Native Rust background daemon for Ki-Kernel
# ==============================================================================

# Master toggle for Auto Game Turbo (1=Enabled, 0=Paused)
DAEMON_ENABLED=1

# Default profile restored when exiting games (0=Battery Saver, 1=Balanced)
DEFAULT_PROFILE=1

# Profile applied automatically when a game is in foreground (2=Turbo Gaming)
GAME_PROFILE=2

# Automatically engage bypass charging during games when plugged into a charger (1=On, 0=Off)
AUTO_BYPASS=1

# Automatically boost MGLRU to Mode 7 during games and restore to Mode 1 on exit (1=On, 0=Off)
AUTO_MGLRU=1

# Recognized game package names (comma-separated, no spaces)
GAMES=com.mobile.legends,com.miHoYo.GenshinImpact,com.miHoYo.hkrpg,com.dts.freefireth,com.dts.freefiremax,com.pubg.krmobile,com.pubg.imobile,com.vng.pubgmobile,com.tencent.ig,com.riotgames.league.wildrift,com.activision.callofduty.shooter,com.ea.gp.apexlegendsmobilefps,com.epicgames.fortnite,com.roblox.client,com.mojang.minecraftpe,com.kurogame.wutheringwaves.global,com.kurogame.haru.google,com.nexon.bluearchive,com.YoStar.AetherGazer,com.YoStarEN.Arknights,com.YoStarEN.AzurLane,com.hypergryph.arknights,com.carxtech.sr,com.ea.gp.fifamobile,com.konami.pesam
