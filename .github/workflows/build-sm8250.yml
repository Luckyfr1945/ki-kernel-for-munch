name: Build SM8250 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Pilih Target Device SM8250'
        required: true
        default: 'munch - POCO F4 / Redmi K40S'
        type: choice
        options:
          - 'munch - POCO F4 / Redmi K40S'
          - 'popular - Alioth (POCO F3) & LMI (POCO F2 Pro)'
          - 'alioth - POCO F3 / Redmi K40'
          - 'lmi - POCO F2 Pro / Redmi K30 Pro'
          - 'all - Semua Device Non-F4 Sekaligus (12 Device)'
          - 'apollo - Mi 10T / Mi 10T Pro'
          - 'thyme - Mi 10S'
          - 'umi - Mi 10'
          - 'cmi - Mi 10 Pro'
          - 'cas - Mi 10 Ultra'
          - 'pipa - Xiaomi Pad 6'
          - 'psyche - Xiaomi 12X'
          - 'dagu - Xiaomi Pad 5 Pro 12.4'
          - 'elish - Xiaomi Pad 5 Pro WiFi'
          - 'enuma - Xiaomi Pad 5 Pro 5G'
      variant:
        description: 'Varian Root'
        required: true
        default: 'all - Semua Varian (KSU+SUSFS, KSU, NOKSU)'
        type: choice
        options:
          - 'all - Semua Varian (KSU+SUSFS, KSU, NOKSU)'
          - 'ksu - BakaSU + SuSFS v2.4.0'
          - 'nosusfs - BakaSU Only (Tanpa SuSFS)'
          - 'noksu - Vanilla Non-Root'
      target_os:
        description: 'Target OS'
        required: true
        default: 'both - Universal Dual-OS (AOSP & MIUI)'
        type: choice
        options:
          - 'both - Universal Dual-OS (AOSP & MIUI)'
          - 'aosp - AOSP Only'
          - 'miui - MIUI / HyperOS Only'
          - 'coloros - ColorOS / OxygenOS'
      branch:
        description: 'Branch Kernel'
        required: true
        default: 'beta-test'
      telegram_topic:
        description: 'ID Topik Telegram (default: 4 untuk Discussion)'
        required: false
        default: '4'

jobs:
  setup:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set-matrix.outputs.devices }}
      variants: ${{ steps.set-matrix.outputs.variants }}
      target_os: ${{ steps.set-matrix.outputs.target_os }}
    steps:
      - id: set-matrix
        run: |
          CHOSEN_DEV=$(echo "${{ inputs.device }}" | awk '{print $1}')
          if [ "$CHOSEN_DEV" = "popular" ]; then
            echo 'devices=["alioth","lmi"]' >> $GITHUB_OUTPUT
          elif [ "$CHOSEN_DEV" = "all" ]; then
            echo 'devices=["alioth","apollo","thyme","lmi","umi","cmi","cas","pipa","psyche","dagu","elish","enuma"]' >> $GITHUB_OUTPUT
          else
            echo "devices=[\"$CHOSEN_DEV\"]" >> $GITHUB_OUTPUT
          fi

          CHOSEN_VAR=$(echo "${{ inputs.variant }}" | awk '{print $1}')
          if [ "$CHOSEN_VAR" = "all" ]; then
            echo 'variants=["ksu","nosusfs","noksu"]' >> $GITHUB_OUTPUT
          else
            echo "variants=[\"$CHOSEN_VAR\"]" >> $GITHUB_OUTPUT
          fi

          CHOSEN_OS=$(echo "${{ inputs.target_os }}" | awk '{print $1}')
          echo "target_os=$CHOSEN_OS" >> $GITHUB_OUTPUT

      - name: Cache Neutron Clang 24
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /home/runner/neutron-clang
          key: neutron-clang-24-06092026

      - name: Pre-download Neutron Clang 24
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          mkdir -p $HOME/neutron-clang
          cd $HOME/neutron-clang
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst -o neutron-clang.tar.zst
          tar --use-compress-program=unzstd -xf neutron-clang.tar.zst
          rm -f neutron-clang.tar.zst

  build:
    name: Build (${{ matrix.device }} - ${{ matrix.variant }})
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.setup.outputs.devices) }}
        variant: ${{ fromJson(needs.setup.outputs.variants) }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      # External modules are pinned to the exact commits used for local
      # builds, so CI zips match what was tested on device. drivers/kernelsu,
      # fs/nomount and security/baseband-guard are symlinks tracked in git.
      - name: Setup External Modules (BakaSU, NoMount, Baseband-guard)
        env:
          BAKASU_REV: 548d1dda060ca198823d8808804d01f5209ef4a9  # + .github/ci-patches/bakasu.patch
          NOMOUNT_REV: dcd77d03e9912f397a586d7da81694d1628f170e  # upstream master
          BBG_REV: a54e0dc6cf0aff4dd87fec49644a02d2eb612905
        run: |
          set -euo pipefail
          fetch_rev() {  # <url> <dir> <rev>
            rm -rf "$2"
            git init -q "$2"
            git -C "$2" remote add origin "$1"
            git -C "$2" fetch -q --depth=1 origin "$3"
            git -C "$2" checkout -q "$3"
            echo "$2 -> $(git -C "$2" rev-parse --short=12 HEAD)"
          }

          fetch_rev https://github.com/Baka-SU/BakaSU.git KernelSU "$BAKASU_REV"
          # Multi-manager, OriginSU/YukiSU and SuSFS v2.4.0 changes: must apply
          git -C KernelSU apply --whitespace=nowarn "$GITHUB_WORKSPACE/.github/ci-patches/bakasu.patch"

          fetch_rev https://github.com/maxsteeel/nomount.git NoMount "$NOMOUNT_REV"
          fetch_rev https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard "$BBG_REV"

          test -f drivers/kernelsu/Kconfig
          test -f fs/nomount/Kconfig
          test -f security/baseband-guard/Kconfig

      - name: Install Dependencies & Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            libssl-dev libelf-dev zip python3 python3-pip

      - name: Restore Neutron Clang 24 Cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /home/runner/neutron-clang
          key: neutron-clang-24-06092026

      - name: Setup Neutron Clang 24 (Fallback)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/neutron-clang
          cd $HOME/neutron-clang
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst -o neutron-clang.tar.zst
          tar --use-compress-program=unzstd -xf neutron-clang.tar.zst
          rm -f neutron-clang.tar.zst

      - name: Compile Kernel (${{ matrix.device }} - ${{ matrix.variant }})
        run: |
          export PATH="$HOME/neutron-clang/bin:$PATH"
          chmod +x build.sh tools/hostcc
          bash build.sh ${{ matrix.device }} ${{ matrix.variant }} ${{ needs.setup.outputs.target_os }}

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ki-Kernel-${{ matrix.device }}-${{ matrix.variant }}-${{ needs.setup.outputs.target_os }}-${{ github.run_number }}
          path: '*.zip'
          if-no-files-found: error

      - name: Send Flashable Zip to Telegram
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || '-1004420069477' }}
          TG_TOPIC_ID: ${{ inputs.telegram_topic || secrets.TG_TOPIC_ID || '4' }}
        run: |
          pip install --break-system-packages telethon
          python3 - << 'EOF'
          import asyncio
          import os
          import glob
          import hashlib
          from telethon import TelegramClient

          TELEGRAM_API_ID = 2040
          TELEGRAM_API_HASH = "b18441a1ff607e10a989891a5462e627"

          BOT_TOKEN = os.environ.get("TG_BOT_TOKEN", "").strip()
          if not BOT_TOKEN:
              print("TG_BOT_TOKEN secret not set, skipping Telegram upload.")
              raise SystemExit(0)

          CHAT_ID = int(os.environ.get("TG_CHAT_ID", "-1004420069477"))
          RAW_TOPIC = os.environ.get("TG_TOPIC_ID", "4").strip()
          TOPIC_ID = int(RAW_TOPIC) if RAW_TOPIC.isdigit() else 4

          DEV_NAMES = {
              "munch": "POCO F4 / Redmi K40S",
              "alioth": "POCO F3 / Redmi K40",
              "apollo": "Mi 10T / Mi 10T Pro",
              "thyme": "Mi 10S",
              "lmi": "POCO F2 Pro / Redmi K30 Pro",
              "umi": "Mi 10",
              "cmi": "Mi 10 Pro",
              "cas": "Mi 10 Ultra",
              "pipa": "Xiaomi Pad 6",
              "psyche": "Xiaomi 12X",
              "dagu": "Xiaomi Pad 5 Pro 12.4",
              "elish": "Xiaomi Pad 5 Pro WiFi",
              "enuma": "Xiaomi Pad 5 Pro 5G",
          }

          zips = glob.glob("*.zip")
          if not zips:
              print("No zip file found to upload.")
              exit(1)

          zip_file = max(zips, key=os.path.getmtime)
          filename = os.path.basename(zip_file)
          filesize_mb = os.path.getsize(zip_file) / (1024 * 1024)

          h = hashlib.sha256()
          with open(zip_file, "rb") as f:
              while chunk := f.read(1024 * 1024 * 4):
                  h.update(chunk)
          sha256 = h.hexdigest()

          device = "${{ matrix.device }}"
          variant = "${{ matrix.variant }}"
          target_os = "${{ needs.setup.outputs.target_os }}"
          device_label = DEV_NAMES.get(device, device)
          run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          caption = (
              f"🚀 *Ki-Kernel Build Released!*\n\n"
              f"📱 *Device:* `{device}` ({device_label})\n"
              f"🧩 *Variant:* `{variant}`\n"
              f"🌐 *OS Target:* `{target_os}`\n"
              f"📦 *File:* `{filename}`\n"
              f"📊 *Size:* `{filesize_mb:.1f} MB`\n"
              f"🔒 *SHA256:*\n`{sha256}`\n\n"
              f"🔗 [GitHub Actions Run]({run_url})\n"
              f"#kikernel #{device} #release"
          )

          async def main():
              client = TelegramClient("gha_tg_session", TELEGRAM_API_ID, TELEGRAM_API_HASH)
              await client.start(bot_token=BOT_TOKEN)

              print(f"Mengunggah {filename} ({filesize_mb:.1f} MB) ke {CHAT_ID} (topik #{TOPIC_ID})...")
              sent = False
              try:
                  await client.send_file(
                      entity=CHAT_ID,
                      file=zip_file,
                      caption=caption,
                      parse_mode="md",
                      reply_to=TOPIC_ID
                  )
                  print(f"✅ Berhasil terkirim ke Telegram topik #{TOPIC_ID}!")
                  sent = True
              except Exception as e:
                  print(f"⚠️ Gagal kirim ke topik #{TOPIC_ID}: {e}. Mencoba kirim tanpa reply_to...")
                  try:
                      await client.send_file(
                          entity=CHAT_ID,
                          file=zip_file,
                          caption=caption,
                          parse_mode="md"
                      )
                      print("✅ Berhasil terkirim ke Telegram!")
                      sent = True
                  except Exception as e2:
                      print(f"⚠️ Gagal kirim tanpa topik: {e2}")

              if not sent:
                  print("⚠️ Gagal mengirim file ke Telegram, namun zip tetap tersimpan di GitHub Artifacts.")

              await client.disconnect()

          asyncio.run(main())
          EOF
