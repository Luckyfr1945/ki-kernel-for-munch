name: Build SM8250 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Pilih Target Device SM8250'
        required: true
        default: 'popular - Alioth (POCO F3) & LMI (POCO F2 Pro)'
        type: choice
        options:
          - 'popular - Alioth (POCO F3) & LMI (POCO F2 Pro)'
          - 'alioth - POCO F3 / Redmi K40'
          - 'lmi - POCO F2 Pro / Redmi K30 Pro'
          - 'all - Semua Device Non-F4 Sekaligus (12 Device)'
          - 'apollo - Mi 10T / Mi 10T Pro'
          - 'thyme - Mi 10S'
          - 'umi - Mi 10'
          - 'cmi - Mi 10 Pro'
          - 'cas - Mi 10 Ultra'
          - 'pipa - Xiaomi Pad 6'
          - 'psyche - Xiaomi 12X'
          - 'dagu - Xiaomi Pad 5 Pro 12.4'
          - 'elish - Xiaomi Pad 5 Pro WiFi'
          - 'enuma - Xiaomi Pad 5 Pro 5G'
      variant:
        description: 'Varian Root'
        required: true
        default: 'all - Semua Varian (KSU+SUSFS, KSU, NOKSU)'
        type: choice
        options:
          - 'all - Semua Varian (KSU+SUSFS, KSU, NOKSU)'
          - 'ksu - ReSukiSU + SuSFS v2.3.0'
          - 'nosusfs - ReSukiSU Only (Tanpa SuSFS)'
          - 'noksu - Vanilla Non-Root'
      target_os:
        description: 'Target OS'
        required: true
        default: 'both - Universal Dual-OS (AOSP & MIUI)'
        type: choice
        options:
          - 'both - Universal Dual-OS (AOSP & MIUI)'
          - 'aosp - AOSP Only'
          - 'miui - MIUI / HyperOS Only'
          - 'coloros - ColorOS / OxygenOS'
      branch:
        description: 'Branch Kernel'
        required: true
        default: 'beta-test'
      telegram_topic:
        description: 'ID Topik Telegram (kosongkan untuk auto-detect topik aktif)'
        required: false
        default: ''

jobs:
  setup:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set-matrix.outputs.devices }}
      variants: ${{ steps.set-matrix.outputs.variants }}
      target_os: ${{ steps.set-matrix.outputs.target_os }}
    steps:
      - id: set-matrix
        run: |
          CHOSEN_DEV=$(echo "${{ inputs.device }}" | awk '{print $1}')
          if [ "$CHOSEN_DEV" = "popular" ]; then
            echo 'devices=["alioth","lmi"]' >> $GITHUB_OUTPUT
          elif [ "$CHOSEN_DEV" = "all" ]; then
            echo 'devices=["alioth","apollo","thyme","lmi","umi","cmi","cas","pipa","psyche","dagu","elish","enuma"]' >> $GITHUB_OUTPUT
          else
            echo "devices=[\"$CHOSEN_DEV\"]" >> $GITHUB_OUTPUT
          fi

          CHOSEN_VAR=$(echo "${{ inputs.variant }}" | awk '{print $1}')
          if [ "$CHOSEN_VAR" = "all" ]; then
            echo 'variants=["ksu","nosusfs","noksu"]' >> $GITHUB_OUTPUT
          else
            echo "variants=[\"$CHOSEN_VAR\"]" >> $GITHUB_OUTPUT
          fi

          CHOSEN_OS=$(echo "${{ inputs.target_os }}" | awk '{print $1}')
          echo "target_os=$CHOSEN_OS" >> $GITHUB_OUTPUT

      - name: Cache ZyCromerZ Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /home/runner/zyc-clang
          key: zyc-clang-16.0.6-20260807

      - name: Pre-download ZyCromerZ Clang 16
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz -o Clang.tar.gz
          tar -xf Clang.tar.gz
          rm -f Clang.tar.gz

  build:
    name: Build (${{ matrix.device }} - ${{ matrix.variant }})
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.setup.outputs.devices) }}
        variant: ${{ fromJson(needs.setup.outputs.variants) }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Setup External Modules (BakaSU, NoMount, Baseband-guard)
        run: |
          # 1. Setup KernelSU (BakaSU)
          rm -rf KernelSU
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git KernelSU
          if [ -f ".github/ci-patches/bakasu.patch" ]; then
            cd KernelSU
            git apply ../.github/ci-patches/bakasu.patch || echo "BakaSU patch applied with fallback"
            cd ..
          fi
          mkdir -p drivers
          ln -sf ../KernelSU/kernel drivers/kernelsu

          # 2. Setup NoMount
          rm -rf NoMount
          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git NoMount || \
          git clone --depth=1 https://github.com/maxsteeel/nomount.git NoMount
          mkdir -p fs
          ln -sf ../NoMount/kernel/src fs/nomount

          # 3. Setup Baseband-guard
          rm -rf Baseband-guard
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
          mkdir -p security
          ln -sf ../Baseband-guard security/baseband-guard

      - name: Install Dependencies & Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            libssl-dev libelf-dev zip python3 python3-pip

      - name: Restore ZyCromerZ Clang Cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /home/runner/zyc-clang
          key: zyc-clang-16.0.6-20260807

      - name: Setup ZyCromerZ Clang 16 (Fallback)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz -o Clang.tar.gz
          tar -xf Clang.tar.gz
          rm -f Clang.tar.gz

      - name: Compile Kernel (${{ matrix.device }} - ${{ matrix.variant }})
        run: |
          export PATH="$HOME/zyc-clang/bin:$PATH"
          chmod +x build.sh tools/hostcc
          bash build.sh ${{ matrix.device }} ${{ matrix.variant }} ${{ needs.setup.outputs.target_os }}

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ki-Kernel-${{ matrix.device }}-${{ matrix.variant }}-${{ needs.setup.outputs.target_os }}-${{ github.run_number }}
          path: |
            *.zip
            release/*.zip
          if-no-files-found: error

      - name: Send Flashable Zip to Telegram
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || '-1004420069477' }}
          TG_TOPIC_ID: ${{ inputs.telegram_topic || secrets.TG_TOPIC_ID || '' }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "TG_BOT_TOKEN secret not set in GitHub repository secrets, skipping Telegram notification."
            exit 0
          fi
          pip install --break-system-packages telethon
          python3 - << 'EOF'
          import asyncio
          import os
          import glob
          import hashlib
          from telethon import TelegramClient

          TELEGRAM_API_ID = 2040
          TELEGRAM_API_HASH = "b18441a1ff607e10a989891a5462e627"
          BOT_TOKEN = os.environ.get("TG_BOT_TOKEN", "").strip()
          CHAT_ID = int(os.environ.get("TG_CHAT_ID", "-1004420069477"))
          RAW_TOPIC = os.environ.get("TG_TOPIC_ID", "").strip()
          TOPIC_ID = int(RAW_TOPIC) if RAW_TOPIC.isdigit() else None

          DEV_NAMES = {
              "alioth": "POCO F3 / Redmi K40",
              "apollo": "Mi 10T / Mi 10T Pro",
              "thyme": "Mi 10S",
              "lmi": "POCO F2 Pro / Redmi K30 Pro",
              "umi": "Mi 10",
              "cmi": "Mi 10 Pro",
              "cas": "Mi 10 Ultra",
              "pipa": "Xiaomi Pad 6",
              "psyche": "Xiaomi 12X",
              "dagu": "Xiaomi Pad 5 Pro 12.4",
              "elish": "Xiaomi Pad 5 Pro WiFi",
              "enuma": "Xiaomi Pad 5 Pro 5G",
          }

          zips = glob.glob("*.zip") + glob.glob("release/*.zip")
          if not zips:
              print("No zip file found to upload.")
              exit(1)

          zip_file = max(zips, key=os.path.getmtime)
          filename = os.path.basename(zip_file)
          filesize_mb = os.path.getsize(zip_file) / (1024 * 1024)

          h = hashlib.sha256()
          with open(zip_file, "rb") as f:
              while chunk := f.read(1024 * 1024 * 4):
                  h.update(chunk)
          sha256 = h.hexdigest()

          device = "${{ matrix.device }}"
          variant = "${{ matrix.variant }}"
          target_os = "${{ needs.setup.outputs.target_os }}"
          device_label = DEV_NAMES.get(device, device)
          run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          caption = (
              f"🚀 *Ki-Kernel Build Released!*\n\n"
              f"📱 *Device:* `{device}` ({device_label})\n"
              f"🧩 *Variant:* `{variant}`\n"
              f"🌐 *OS Target:* `{target_os}`\n"
              f"📦 *File:* `{filename}`\n"
              f"📊 *Size:* `{filesize_mb:.1f} MB`\n"
              f"🔒 *SHA256:*\n`{sha256}`\n\n"
              f"🔗 [GitHub Actions Run]({run_url})\n"
              f"#kikernel #{device} #release"
          )

          async def main():
              client = TelegramClient("gha_tg_session", TELEGRAM_API_ID, TELEGRAM_API_HASH)
              await client.start(bot_token=BOT_TOKEN)

              target_topic = TOPIC_ID

              # Query active forum topics in case default/specified topic is closed
              try:
                  from telethon.tl.functions.channels import GetForumTopicsRequest
                  res = await client(GetForumTopicsRequest(channel=CHAT_ID, offset_date=0, offset_id=0, offset_topic=0, limit=50))
                  print("--- Daftar Forum Topics di Grup Telegram ---")
                  open_topics = []
                  for t in res.topics:
                      is_closed = getattr(t, 'closed', False)
                      print(f"Topic #{t.id}: '{t.title}' [closed={is_closed}]")
                      if not is_closed:
                          open_topics.append(t)

                  # If user-specified topic is closed or if no topic specified
                  if target_topic is not None:
                      is_target_closed = any(t.id == target_topic and getattr(t, 'closed', False) for t in res.topics)
                      if is_target_closed:
                          print(f"⚠️ Topik #{target_topic} ditutup (closed)! Mengalihkan ke topik aktif...")
                          target_topic = None

                  if target_topic is None and open_topics:
                      # Prefer topic with 'kernel', 'release', 'update', or 'build'
                      preferred = next((t for t in open_topics if any(k in t.title.lower() for k in ["kernel", "release", "build", "update"])), open_topics[0])
                      target_topic = preferred.id
                      print(f"👉 Otomatis menggunakan topik aktif #{target_topic} ('{preferred.title}')")
              except Exception as e:
                  print(f"ℹ️ Info forum topics check: {e}")

              print(f"Mengunggah {filename} ({filesize_mb:.1f} MB) ke {CHAT_ID} (topik: {target_topic})...")
              sent = False

              if target_topic is not None:
                  try:
                      await client.send_file(entity=CHAT_ID, file=zip_file, caption=caption, parse_mode="md", reply_to=target_topic)
                      print(f"✅ Berhasil terkirim ke Telegram topik #{target_topic}!")
                      sent = True
                  except Exception as e:
                      print(f"⚠️ Gagal kirim ke topik #{target_topic}: {e}")

              if not sent:
                  try:
                      await client.send_file(entity=CHAT_ID, file=zip_file, caption=caption, parse_mode="md")
                      print("✅ Berhasil terkirim ke Telegram (tanpa topik)!")
                      sent = True
                  except Exception as e:
                      print(f"⚠️ Gagal kirim ke obrolan utama: {e}")

              if not sent:
                  print("⚠️ Pemberitahuan Telegram gagal, namun flashable zip tetap aman tersimpan di GitHub Artifacts.")

              await client.disconnect()

          asyncio.run(main())
          EOF
